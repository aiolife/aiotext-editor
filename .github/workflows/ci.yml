name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重跑：仓库内容修好之后，不必为了验证再空提交一次
  workflow_dispatch:

jobs:
  frontend:
    name: 前端（lint + test + build）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      # 下面三步都用 `tee` 留底 + 失败时把关键行写成 annotation：
      # 日志正文要登录 GitHub 才看得到（接口也要 token），而 annotation 是公开可读的。
      # 每个 step 只有 10 条 annotation 的额度，所以只挑最有信息量的那几行。
      - name: 单元测试
        id: unit
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log

      - name: 诊断：单测失败原因
        if: failure() && steps.unit.outcome == 'failure'
        shell: bash
        run: |
          grep -aE '✕|FAIL|AssertionError|Error:' unit.log | head -8 | while read -r l; do echo "::error::$l"; done
          tail -2 unit.log | while read -r l; do echo "::error::[末尾] $l"; done

      - name: 类型检查 + 构建
        run: npm run build

  rust:
    name: Rust（fmt + check + test）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # tauri::generate_context! 在**编译期**就要读 frontendDist（../dist）。
      # 前端 job 与 Rust job 跑在各自独立的 runner 上，这里不先构建前端，
      # `cargo check` 会直接报「frontendDist 指向的路径不存在」——
      # 之前这条一直被「格式检查」挡在前面，没暴露出来。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 构建前端（供编译期读取 dist）
        run: |
          npm ci
          npm run build

      # opencc-sys 构建链：cmake（编译 OpenCC C++ 全库）+ LLVM/libclang（bindgen 生成 FFI）
      # Linux 不用这个 action：它装的 LLVM 18 依赖 libtinfo.so.5，而 ubuntu runner
      # 上只有 libtinfo.so.6 —— libclang 打不开，opencc-sys 的 bindgen 直接 panic，
      # 整个 Ubuntu 侧的编译检查就挂在这上面。Linux 改用发行版自带的 libclang。
      - name: 安装 LLVM（bindgen 需要 libclang）
        if: runner.os != 'Linux'
        uses: kylemayes/install-llvm-action@v2
        with:
          version: "18"

      - name: 配置 LIBCLANG_PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "LIBCLANG_PATH=$LLVM_PATH/bin" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          else
            echo "LIBCLANG_PATH=$LLVM_PATH/lib" >> "$GITHUB_ENV"
          fi

      - name: 安装 Linux 系统依赖（含 cmake 与 libclang）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --check
        working-directory: src-tauri

      - name: 编译检查
        id: cargo_check
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo check 2>&1 | tee check.log

      - name: 诊断：编译检查失败原因
        if: failure() && steps.cargo_check.outcome == 'failure'
        shell: bash
        working-directory: src-tauri
        run: |
          grep -aE '^error|panicked|not found|failed to run|Runtime\.|thread' check.log | head -8 | while read -r l; do echo "::error::$l"; done
          tail -2 check.log | while read -r l; do echo "::error::[末尾] $l"; done

      - name: Clippy（视警告为错误）
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust 单测（core 层 + 前后端契约集成测试）
        id: cargo_test
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log

      - name: 诊断：Rust 单测失败原因
        if: failure() && steps.cargo_test.outcome == 'failure'
        shell: bash
        working-directory: src-tauri
        run: |
          grep -aE '^test .*FAILED|panicked|^failures:|^error|left:|right:' test.log | head -8 | while read -r l; do echo "::error::$l"; done
          grep -aE '^test .*FAILED|^test result' test.log | tail -2 | while read -r l; do echo "::error::[末尾] $l"; done

