name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重跑：仓库内容修好之后，不必为了验证再空提交一次
  workflow_dispatch:

jobs:
  frontend:
    name: 前端（lint + test + build）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 类型检查 + 构建
        run: npm run build

  rust:
    name: Rust（fmt + check + test）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # opencc-sys 构建链：cmake（编译 OpenCC C++ 全库）+ LLVM/libclang（bindgen 生成 FFI）
      - name: 安装 LLVM（bindgen 需要 libclang）
        uses: kylemayes/install-llvm-action@v2
        with:
          version: "18"

      - name: 配置 LIBCLANG_PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "LIBCLANG_PATH=$LLVM_PATH/bin" >> "$GITHUB_ENV"
          else
            echo "LIBCLANG_PATH=$LLVM_PATH/lib" >> "$GITHUB_ENV"
          fi

      - name: 安装 Linux 系统依赖（含 cmake）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --check
        working-directory: src-tauri

      - name: 编译检查
        run: cargo check
        working-directory: src-tauri

      - name: Clippy（视警告为错误）
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust 单测（core 层 + 前后端契约集成测试）
        run: cargo test
        working-directory: src-tauri

